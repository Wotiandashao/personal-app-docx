<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="个人 APP 可交互离线原型">
  <title>个人 APP 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <!-- 首页 -->
    <section class="page" data-page="home" aria-labelledby="home-title">
      <header class="masthead">
        <h1 id="home-title" class="page-title">首页</h1>
        <div id="home-date-full" class="page-date">2026 年 9 月 21 日 · 周一</div>
      </header>

      <div class="paper">
        <section class="panel home-todo-panel" aria-labelledby="home-todo-bar">
          <div class="section-bar" id="home-todo-bar">
            <h2 class="card-title">今日待办</h2>
            <small id="home-todo-count">0 项待完成</small>
          </div>
          <div id="home-todo-list" class="task-list"></div>
        </section>

        <div class="section-gap"></div>

        <div class="row-heading">
          <h2>下一餐</h2>
          <small id="home-next-meal-meta">午餐 12:00</small>
        </div>
        <button id="home-next-meal" class="panel next-meal-card" type="button" aria-label="查看午餐">
          <div id="home-next-meal-list" class="food-grid"></div>
          <div class="caption-line">
            <span>午餐 · 12:00</span>
            <span class="link-label">查看餐品 <span class="arrow-icon" aria-hidden="true">›</span></span>
          </div>
        </button>
      </div>
    </section>

    <!-- 点餐页 -->
    <section class="page" data-page="meals" aria-labelledby="meals-title">
      <header class="masthead meals-head">
        <h1 id="meals-title" class="page-title">点餐</h1>
        <button id="meal-edit-toggle" class="header-action" type="button">修改</button>
      </header>

      <div class="paper meal-paper">
        <div id="meals-content" class="meal-content-list"></div>
      </div>
    </section>

    <!-- 选餐页（子页，隐藏底部导航） -->
    <section class="page food-select-page" data-page="food-select" aria-labelledby="food-select-title">
      <header class="select-head">
        <button id="back-to-meals" class="back" type="button" aria-label="返回点餐页">
          <span class="back-icon" aria-hidden="true">‹</span> 返回点餐
        </button>
        <h1 id="food-select-title" class="page-title">选餐</h1>
      </header>

      <div class="paper select-paper">
        <div class="target">
          <span class="target-bar" aria-hidden="true"></span>
          <span id="meal-target-label">当前将加入 · 午餐</span>
        </div>
        <div class="select-layout">
          <nav id="food-categories" class="categories" aria-label="食物分类"></nav>
          <div id="food-list" class="select-list" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <!-- 待办页 -->
    <section class="page" data-page="todos" aria-labelledby="todos-title">
      <header class="masthead">
        <h1 id="todos-title" class="page-title">待办</h1>
      </header>

      <div class="paper todo-paper">
        <section class="panel calendar" aria-label="任务日历">
          <div class="month">
            <button id="previous-month" class="calendar-arrow previous" type="button" aria-label="上个月">‹</button>
            <h2 id="calendar-title"></h2>
            <button id="next-month" class="calendar-arrow next" type="button" aria-label="下个月">›</button>
          </div>
          <div class="weekday-row week" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-days" class="calendar-days days" aria-label="选择日期"></div>
        </section>

        <form id="task-form" class="panel task-entry" novalidate>
          <label class="sr-only" for="task-input">添加任务</label>
          <input id="task-input" type="text" maxlength="50" placeholder="添加任务" autocomplete="off">
          <button class="plus" type="submit" aria-label="添加任务">+</button>
        </form>

        <div class="todo-date-row">
          <h2 id="todo-selected-date-label">09 月 21 日 · 周一</h2>
          <span id="todo-count-badge">0 项待完成</span>
        </div>

        <section class="panel todo-panel">
          <div id="todo-list" class="task-list"></div>
        </section>
      </div>
    </section>

    <!-- 我的页 -->
    <section class="page" data-page="profile" aria-labelledby="profile-title">
      <header class="masthead">
        <h1 id="profile-title" class="page-title">我的</h1>
      </header>

      <div class="paper profile-paper">
        <section class="identity panel" aria-label="个人信息">
          <div class="identity-top">
            <div class="avatar" role="img" aria-label="用户头像"></div>
            <h2 class="identity-name">小满</h2>
          </div>
          <dl class="data-rows">
            <div class="data-row"><dt>昵称</dt><dd>小满</dd></div>
            <div class="data-row"><dt>手机号</dt><dd>138****8888</dd></div>
          </dl>
        </section>

        <button id="logout-button" class="panel logout-card" type="button">退出登录</button>
      </div>
    </section>
  </main>

  <!-- 底部主导航 -->
  <nav id="bottom-nav" class="bottom" aria-label="主导航">
    <button type="button" data-nav="home" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-7v-7h-4v7H3Z"/></svg>
      <span>首页</span>
    </button>
    <button type="button" data-nav="meals" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v7m3-7v7m3-7v7M5 8h6m-3 2v12M18 3c-4 4-4 9 0 9V3Zm0 9v10"/></svg>
      <span>点餐</span>
    </button>
    <button type="button" data-nav="todos" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H4v17h16V5h-4M8 3h8v5H8Z M8 13l2 2 5-5m-7 9h8"/></svg>
      <span>待办</span>
    </button>
    <button type="button" data-nav="profile" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 22c0-12 18-12 18 0"/></svg>
      <span>我的</span>
    </button>
  </nav>

  <!-- 全局 Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 退出弹窗 -->
  <div id="logout-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-modal-title">
      <h2 id="logout-modal-title">确认退出登录？</h2>
      <p>这只是原型演示，不会跳转到登录页面。</p>
      <div class="modal-actions">
        <button id="cancel-logout" class="modal-button secondary" type="button">取消</button>
        <button id="confirm-logout" class="modal-button danger" type="button">确认退出</button>
      </div>
    </section>
  </div>

  <script defer src="app.js"></script>
</body>
</html>
