<html lang="zh-CN">
<head>

<title>个人 APP 蓝调独立志 UI 风格效果图</title>
<style>
:root{--blue:#000080;--night:#20296c;--paper:#fffafa;--ink:#111333;--yellow:#f4e44c;--pink:#ec77ac;--muted:#62627a;--line:#cdccd7;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:#e9e6df}button,a,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ca417d;outline-offset:3px}button{color:inherit}button:active{transform:translateY(1px)}
.intro{padding:42px 42px 28px;max-width:1600px;margin:auto}.kicker{font:700 12px/1.5 Consolas,monospace;letter-spacing:2px}.intro h1{font-size:38px;letter-spacing:-1px;margin:8px 0 14px}.intro p{font-size:15px;line-height:1.8;margin:0;color:#525266}.intro-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.seal{display:grid;place-items:center;width:72px;height:72px;border:2px solid var(--blue);border-radius:50%;font-weight:900;color:var(--blue);transform:rotate(10deg);font-size:12px;text-align:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.toolbar a{border:1px solid var(--ink);padding:8px 14px;font-size:13px}.toolbar a.current{background:var(--blue);color:var(--paper)}

.status{height:33px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 23px;color:var(--paper);font:700 12px Consolas,monospace;position:relative}.device{display:flex;align-items:center;gap:6px}.signal{width:12px;height:10px;background:linear-gradient(to right,var(--paper) 0 20%,transparent 20% 30%,var(--paper) 30% 50%,transparent 50% 60%,var(--paper) 60% 80%,transparent 80%);clip-path:polygon(0 80%,30% 80%,30% 50%,60% 50%,60% 0,100% 0,100% 100%,0 100%)}.battery{height:8px;width:19px;border:1px solid var(--paper);padding:1px;display:inline-flex}.battery:after{content:"";width:13px;background:var(--paper)}
.masthead{position:relative;height:145px;flex-shrink:0;margin:0 20px;color:var(--paper);padding:9px 0 16px}.masthead .issue{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff70;padding-top:10px;font:700 11px Consolas,monospace;letter-spacing:1px}.masthead h2{position:relative;font-size:40px;font-weight:900;line-height:1.2;letter-spacing:1px;margin:19px 0 9px;width:max-content;max-width:90%;text-shadow:2px 2px 0 #08084a}.masthead h2 .star{color:var(--yellow);font-size:40px;display:inline-block;margin-left:7px;transform:rotate(12deg)}.masthead .subtitle{font:11px Consolas,monospace;letter-spacing:2.5px;color:#eeecff}.masthead .sticker{position:absolute;right:0;top:74px;transform:rotate(-8deg);padding:6px 9px;background:var(--pink);color:var(--ink);font:900 13px/1.1 Arial,sans-serif;border:1px solid var(--ink);box-shadow:3px 3px 0 #000040}.masthead .sticker:before{content:"";height:14px;width:2px;background:var(--paper);position:absolute;left:18px;top:-18px;transform:rotate(15deg)}

.section-bar{display:flex;align-items:center;justify-content:space-between;gap:7px;background:var(--blue);color:var(--paper);padding:10px 12px;margin:0;font-size:18px;font-weight:800;line-height:24px}.section-bar small{font:12px Consolas,monospace;color:var(--yellow)}.section-bar .icon{color:var(--yellow);margin-right:6px}.panel{border:1.5px solid var(--blue);background:var(--paper);box-shadow:3px 3px 0 #00008018}.task-list{padding:0 14px}.task-row{display:flex;gap:10px;align-items:center;min-height:64px;border-bottom:1px dashed var(--line);font-size:16px}.task-row:last-child{border:0}.check{display:inline-grid;place-items:center;flex-shrink:0;width:44px;height:44px;background:none;border:0;padding:0}.check:before{content:"";border:1.5px solid var(--blue);border-radius:50%;width:23px;height:23px}.check.done:before{content:"✓";background:var(--blue);color:var(--paper);font-weight:bold}.task-row.done .task-title{color:var(--muted);text-decoration:line-through}.task-title{overflow-wrap:anywhere}.textlink{display:flex;justify-content:flex-end;align-items:center;min-height:44px;padding:0 14px;font-size:13px;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:4px}.section-gap{height:26px}.row-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.row-heading h3{font-size:21px;margin:0;font-weight:900}.row-heading small{font-size:12px;color:var(--muted)}.tag{background:var(--yellow);color:var(--ink);font:700 11px Consolas,monospace;padding:4px 6px;border:1px solid var(--ink);display:inline-block;transform:rotate(-3deg)}
.food-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px 10px 8px}.food{min-width:0;text-align:center}.food-name{font-size:13px;font-weight:700;display:block;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}.photo{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--ink);overflow:hidden;background:#f5f0e9}.crop{width:100px;height:100px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background-image:url('assets/meal-source.png');background-size:460px auto;background-repeat:no-repeat}.milk{background-position:-178px -148px}.rice{background-position:-46px -426px}.chicken{background-position:-178px -426px}.broccoli{background-position:-310px -426px}.noodles{background-position:-46px -705px}.egg{background-position:-178px -705px}.greens{background-position:-310px -705px}.bread,.oatmeal{background-image:url('assets/food-source.png');background-size:330px auto}.bread{background-position:-100px -208px}.oatmeal{background-position:-100px -364px}
.caption-line{border-top:1px dashed var(--line);margin:5px 12px 0;padding:11px 0 10px;display:flex;justify-content:space-between;font:11px Consolas,monospace;color:var(--muted)}.small-note{font:10px/1.6 Consolas,monospace;letter-spacing:1.8px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:10px}.small-note:after{content:"";flex:1;border-top:1px solid var(--line)}
.bottom{position:relative;flex-shrink:0;height:88px;background:var(--blue);display:grid;grid-template-columns:repeat(4,1fr);align-items:start;padding:9px 12px 22px;gap:7px;border-top:1px solid #fff6}.bottom a{height:55px;color:var(--paper);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom a.active{background:var(--yellow);color:var(--blue);box-shadow:3px 3px 0 #ffffff35}.bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:106px;height:4px;background:var(--paper);border-radius:2px}.footer-note{padding:0 42px 30px;max-width:1600px;margin:auto;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#525266;line-height:1.7}.swatches{display:flex;gap:7px;align-items:center}.swatches i{width:14px;height:14px;border:1px solid #11133340}
.header-action{color:var(--ink);position:absolute;right:0;top:70px;min-height:44px;padding:0 13px;background:var(--yellow);border:1px solid var(--ink);font-weight:800;font-size:14px;box-shadow:3px 3px 0 #000040}.meal-paper{padding-top:24px}.meal-block{margin-bottom:10px}.meal-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}.meal-top .num{font:900 11px Consolas,monospace;background:var(--blue);color:var(--paper);padding:5px}.meal-top h3{font-size:18px;margin:0}.meal-top .plus{margin-left:auto;width:44px;min-height:44px}.plus{background:var(--blue);color:var(--paper);border:0;display:inline-grid;place-items:center;font-size:28px;line-height:1;font-weight:400;width:44px;height:44px}.meal-block .food-grid{padding:9px;gap:8px}.meal-block .photo{aspect-ratio:1.3}.meal-block .food-name{margin-top:5px}.meal-block .panel{box-shadow:2px 2px 0 #00008018}.meal-block:last-child{margin-bottom:0}.back{color:var(--paper);font-size:12px;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center}.select-head{height:145px}.select-head h2{margin:6px 0 7px}.select-head .issue{padding-top:0}.select-head .sticker{top:64px}.select-paper{padding-left:10px;padding-right:10px}.target{padding:10px 12px;background:var(--yellow);font-size:13px;font-weight:700;border:1px solid var(--blue);margin-bottom:15px;display:flex;justify-content:space-between}.target span{font:11px Consolas,monospace}.select-layout{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}.categories{border-right:1px solid var(--line);padding-right:9px}.categories button{font-size:14px;height:48px;width:100%;border:0;background:none;padding:0;margin-bottom:9px}.categories button.active{background:var(--blue);color:var(--paper);font-weight:700;border-bottom:4px solid var(--yellow)}.select-list{display:grid;gap:13px;align-content:start}.food-choice{border:1px solid var(--blue);display:grid;grid-template-columns:88px minmax(0,1fr);padding:8px;gap:10px;min-height:115px;box-shadow:2px 2px 0 #00008016}.food-choice .photo{width:88px;height:95px}.food-choice .choice-info{min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}.choice-info strong{font-size:15px;line-height:1.5}.choice-info .plus{align-self:flex-end}.select-bottom{position:relative;color:var(--paper);min-height:40px;text-align:center;font:10px Consolas,monospace;padding:10px 0 20px;letter-spacing:2px}
.calendar{border:1.5px solid var(--blue);box-shadow:3px 3px 0 #00008018;margin-bottom:18px}.month{display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:var(--paper);padding:0 5px}.month strong{font-size:17px}.month button{background:none;color:var(--paper);border:0;width:44px;height:44px;font-size:24px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 3px}.week{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 4px}.days{padding-bottom:9px}.day{position:relative;min-height:44px;border:0;background:none;font:14px Consolas,monospace;display:grid;place-items:center}.day.selected{background:var(--blue);color:var(--paper);box-shadow:inset 0 -4px var(--yellow);font-weight:900}.task-entry{display:flex;border:1.5px solid var(--blue);margin-bottom:19px;background:var(--paper);padding:4px;gap:5px}.task-entry input{width:0;flex:1;min-width:0;border:0;background:none;font-size:16px;padding:0 8px}.task-entry input::placeholder{color:var(--muted)}.todo-date{font-size:13px;display:flex;justify-content:space-between;font-weight:700;margin:0 0 9px}.todo-date span{color:var(--muted);font-weight:400}.todo-paper .task-row{min-height:61px}.todo-paper .task-list{padding:0 8px}
.identity{position:relative;border:1.5px solid var(--blue);box-shadow:4px 4px 0 #0000801c;padding:27px 18px 20px;margin:6px 0 30px}.identity:before{content:"";position:absolute;width:82px;height:19px;top:-11px;left:calc(50% - 41px);background:#f4e44cc9;transform:rotate(-4deg)}.identity-top{display:flex;align-items:center;gap:17px;padding-bottom:22px}.avatar{border:2px solid var(--blue);width:76px;height:76px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--blue);display:grid;place-items:center;font-size:37px;font-weight:900;transform:rotate(-7deg);flex-shrink:0}.identity-name{font-size:28px;font-weight:900;margin:0 0 4px}.identity-sub{font:10px Consolas,monospace;letter-spacing:1px;color:var(--muted)}.data-row{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding:17px 0 3px;margin-top:12px;font-size:14px;gap:15px}.data-row dt{color:var(--muted)}.data-row dd{margin:0;font-weight:700}.logout{background:var(--paper);color:#a92748;border:1.5px solid #a92748;width:100%;height:50px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 #a9274816}.profile-art{position:relative;margin:40px auto 0;width:235px;text-align:center;color:var(--blue);transform:rotate(-4deg)}.profile-art .big{font:900 44px/.95 Arial,sans-serif;letter-spacing:-2px}.profile-art .outline{color:var(--paper);-webkit-text-stroke:1px var(--blue)}.profile-art .tiny{font:10px Consolas,monospace;letter-spacing:3px;margin-top:10px}.profile-art .burst{color:var(--pink);font-size:40px;position:absolute;top:-28px;right:-1px}.profile-art .underline{height:5px;background:var(--yellow);margin-top:-4px;position:relative;z-index:-1}.empty{padding:34px 8px;text-align:center;color:var(--muted);font-size:14px}.preview-hint{position:fixed;z-index:50;bottom:20px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--paper);padding:12px 18px;font-size:13px;line-height:1.5;border:1px solid var(--yellow)}.preview-hint[hidden]{display:none}
body.single{background:#e9e6df}body.single .board{display:block;max-width:474px;padding:0 42px 30px}body.single .specimen:not(.shown){display:none}body.single .screen{width:100%;transform:none!important}body.single .viewport{aspect-ratio:auto;height:844px}body.single .intro{max-width:850px}body.single .footer-note{max-width:850px}.render .intro,.render .footer-note,.render .page-label{display:none}.render.single .board{max-width:430px;padding:0}.render.single .viewport{height:100dvh}.render.single .screen{height:100dvh;min-height:0}.render.single .paper{overscroll-behavior:contain}
@media(max-width:1100px){body:not(.render):not(.single) .board{grid-template-columns:repeat(2,minmax(0,1fr));max-width:850px}}@media(max-width:580px){.intro{padding:25px 20px}.intro h1{font-size:29px}.seal{display:none}.board,body.single .board{padding:0 15px 24px}body:not(.render):not(.single) .board{grid-template-columns:1fr;max-width:420px}.footer-note{padding:0 20px 25px;display:block}.footer-note .swatches{margin-top:12px}.render.single .board{padding:0}.masthead h2{font-size:38px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<header class="intro"><div class="intro-top"><div><div class="kicker">PERSONAL APP / VISUAL DIRECTION 01</div><h1>蓝调独立志</h1><p>从刺猬乐队官网的深蓝底色、符号排版与唱片陈列，转译成每天使用的个人 App。</p></div><div class="seal">UI STYLE<br>2026.09<br>RESEARCH</div></div><nav class="toolbar" aria-label="效果图选择"><a href="?" data-view="all">五页总览</a><a href="?page=home" data-view="home">首页</a><a href="?page=meals" data-view="meals">点餐</a><a href="?page=food-select" data-view="food-select">选餐</a><a href="?page=todos" data-view="todos">待办</a><a href="?page=profile" data-view="profile">我的</a></nav></header>
<main class="board" id="board"></main>
<footer class="footer-note"><div>UI 视觉提案 · 画板 390 × 844 · 保留 v1.0.0 五页结构<br>预览仅用于审阅样式与页面切换，业务操作未接入。日期与内容为固定示例。</div><div class="swatches"><i style="background:#000080"></i><i style="background:#20296c"></i><i style="background:#fffafa"></i><i style="background:#f4e44c"></i><i style="background:#ec77ac"></i><span>深蓝 / 纸白 / 点色</span></div></footer>
<div class="preview-hint" id="hint" role="status" hidden></div>
<script>
const names={home:'首页',meals:'点餐','food-select':'选餐',todos:'待办',profile:'我的'};
const english={home:'EVERYDAY / SMALL THINGS',meals:'THREE MEALS / ONE DAY','food-select':'PICK SOMETHING GOOD',todos:'ONE THING AT A TIME',profile:'A LITTLE SPACE OF MY OWN'};
const p=new URLSearchParams(location.search);const current=Object.hasOwn(names,p.get('page'))?p.get('page'):'all';const render=p.get('render')==='1';
if(current!=='all')document.body.classList.add('single');if(render)document.body.classList.add('render');
document.querySelector(`[data-view="${current}"]`).classList.add('current');
function link(page){return '?page='+page+(render?'&render=1':'')}
const icons={home:'<path d="M3 10 12 3l9 7v11h-7v-7h-4v7H3Z"/>',meals:'<path d="M5 3v7m3-7v7m3-7v7M5 8h6m-3 2v12M18 3c-4 4-4 9 0 9V3Zm0 9v10"/>',todos:'<path d="M8 5H4v17h16V5h-4M8 3h8v5H8Z M8 13l2 2 5-5m-7 9h8"/>',profile:'<circle cx="12" cy="7" r="4"/><path d="M3 22c0-12 18-12 18 0"/>'};
function nav(page){return `<nav class="bottom" aria-label="主导航">${['home','meals','todos','profile'].map(id=>`<a href="${link(id)}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg><span>${names[id]}</span></a>`).join('')}<div class="home-indicator"></div></nav>`}
function masthead(page){return `<div class="status"><span>9:41</span><span class="device"><i class="signal"></i><span>●</span><i class="battery"></i></span></div><header class="masthead ${page==='food-select'?'select-head':''}"><div class="issue">${page==='food-select'?`<a href="${link('meals')}" class="back">← 返回点餐</a>`:'<span>个人 APP / PERSONAL</span>'}<span>VOL. 01</span></div><h2>${names[page]}<span class="star" aria-hidden="true">${page==='todos'?'✳':'★'}</span></h2><div class="subtitle">${english[page]}</div>${page==='home'?'<span class="sticker" aria-hidden="true">DAY<br>BY DAY!</span>':page==='profile'?'<span class="sticker" aria-hidden="true">HELLO<br>ME!</span>':page==='meals'?'<button class="header-action" data-demo>修改</button>':''}</header>`}
const labels={rice:'米饭',chicken:'鸡胸肉',broccoli:'西兰花',milk:'牛奶',noodles:'面条',egg:'鸡蛋',greens:'青菜',bread:'全麦面包',oatmeal:'燕麦粥'};
function photo(id){return `<div class="photo" role="img" aria-label="${labels[id]}"><div class="crop ${id}"></div></div>`}
function food(id){return `<div class="food">${photo(id)}<span class="food-name">${labels[id]}</span></div>`}
function tasks(){return `<div class="task-list"><div class="task-row"><button class="check" aria-label="完成今日任务" data-demo></button><span class="task-title">今日任务</span></div><div class="task-row"><button class="check" aria-label="完成阅读30分钟" data-demo></button><span class="task-title">阅读30分钟</span></div></div>`}
function home(){return `<div class="paper"><div class="row-heading"><span class="tag">MON / 09.21</span><small>2026 年 9 月 21 日</small></div><section class="panel"><h3 class="section-bar"><span><b class="icon">✓</b>今日待办</span><small>2 项待完成</small></h3>${tasks()}<a class="textlink" href="${link('todos')}">查看全部 ↗</a></section><div class="section-gap"></div><div class="row-heading"><h3>下一餐 <span aria-hidden="true">↗</span></h3><small>午餐 12:00</small></div><a href="${link('meals')}" class="panel" style="display:block" aria-label="查看下一餐"><div class="food-grid">${['rice','chicken','broccoli'].map(food).join('')}</div><div class="caption-line"><span>LUNCH / 12:00</span><span>查看餐品 →</span></div></a><div class="small-note">MAKE ROOM FOR EVERYDAY.</div></div>`}
function meals(){return `<div class="paper meal-paper">${[['早餐','01',['milk','milk','milk']],['午餐','02',['rice','chicken','broccoli']],['晚餐','03',['noodles','egg','greens']]].map(([title,n,items])=>`<section class="meal-block"><div class="meal-top"><span class="num">${n}</span><h3>${title}</h3><a class="plus" href="${link('food-select')}" aria-label="添加${title}餐品">+</a></div><div class="panel food-grid">${items.map(food).join('')}</div></section>`).join('')}</div>`}
function select(){return `<div class="paper select-paper"><div class="target">当前将加入 · 午餐<span>LUNCH</span></div><div class="select-layout"><nav class="categories" aria-label="食物分类">${['主食','肉类','蔬菜','饮品','水果'].map((c,i)=>`<button class="${i===0?'active':''}" ${i===0?'aria-pressed="true"':'aria-pressed="false"'} data-demo>${c}</button>`).join('')}</nav><section class="select-list" aria-label="主食列表">${['rice','bread','oatmeal','noodles'].map(id=>`<article class="food-choice">${photo(id)}<div class="choice-info"><strong>${labels[id]}</strong><button class="plus" data-demo aria-label="添加${labels[id]}到午餐">+</button></div></article>`).join('')}</section></div></div><div class="select-bottom">PERSONAL / FOOD SELECTION<div class="home-indicator"></div></div>`}
function todos(){let days='<span></span><span></span>';for(let i=1;i<=30;i++)days+=`<button class="day ${i===21?'selected':''}" aria-label="2026年9月${i}日" ${i===21?'aria-pressed="true"':''} data-demo>${i}</button>`;return `<div class="paper todo-paper"><section class="calendar" aria-label="2026年9月日历"><div class="month"><button aria-label="上个月" data-demo>‹</button><strong>2026 年 9 月</strong><button aria-label="下个月" data-demo>›</button></div><div class="week">${['日','一','二','三','四','五','六'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${days}</div></section><div class="task-entry"><input aria-label="添加任务" placeholder="添加任务" maxlength="50" readonly><button class="plus" aria-label="添加任务" data-demo>+</button></div><p class="todo-date">09 月 21 日 · 周一<span>2 项待完成</span></p><section class="panel">${tasks()}</section></div>`}
function profile(){return `<div class="paper"><section class="identity"><div class="identity-top"><div class="avatar" role="img" aria-label="小满头像设计占位">满</div><div><p class="identity-name">小满</p><span class="identity-sub">MY PERSONAL SPACE</span></div></div><dl style="margin:0"><div class="data-row"><dt>昵称</dt><dd>小满</dd></div><div class="data-row"><dt>手机号</dt><dd>138****8888</dd></div></dl></section><button class="logout" data-demo>退出登录 ↗</button><div class="profile-art" aria-hidden="true"><span class="burst">✳</span><div class="big">SMALL<br><span class="outline">THINGS,</span><br>MY LIFE.</div><div class="underline"></div><div class="tiny">EVERYDAY IS MY OWN.</div></div></div>`}
const bodies={home,meals,'food-select':select,todos,profile};
document.getElementById('board').innerHTML=Object.keys(names).map((id,i)=>`<article class="specimen ${current===id?'shown':''}" data-page="${id}"><div class="page-label">${String(i+1).padStart(2,'0')} / ${names[id]}<span>${id==='food-select'?'SUB PAGE':'MAIN PAGE'}</span></div><div class="viewport"><section class="screen">${masthead(id)}${bodies[id]()}${id==='food-select'?'':nav(id)}</section></div></article>`).join('');
function resize(){if(current==='all')document.querySelectorAll('.viewport').forEach(v=>{v.querySelector('.screen').style.transform=`scale(${v.clientWidth/390})`})}resize();addEventListener('resize',resize);
let hintTimer;document.addEventListener('click',e=>{if(!e.target.closest('[data-demo]'))return;const hint=document.getElementById('hint');hint.textContent='这是视觉效果预览；业务交互以 v1.0.0 原型与需求文档为准。';hint.hidden=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.hidden=true,2400)});
</script>
</body>
</html>
